syntax = "proto3";

package noh;

option java_package = "com.facul.noh";
option java_multiple_files = true;

message RequestVoteRequest {
    int32 candidateId = 1;
    int32 termo = 2;
    int32 ultimoTermoLog = 3;
    int32 ultimoIndiceLog = 4;
}

message RequestVoteResponse {
    int32 termo = 1;
    bool votou = 2;
}

service NohService {
    rpc requestVote(RequestVoteRequest) returns (RequestVoteResponse);
}