syntax = "proto3";

package api;

import "google/protobuf/empty.proto";

option java_package = "com.facul.api";
option java_multiple_files = true;

message ObterLiderIdResponse {
    int32 liderId = 1;
}

service ApiService {
    rpc obterLiderId(google.protobuf.Empty) returns (ObterLiderIdResponse);
}